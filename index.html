<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Warrior Store</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            color-scheme: dark; 
            --bg-main: #0f172a;       
            --primary: #38bdf8;       
            --primary-hover: #0ea5e9; 
            --success: #10b981;       
            --error: #ef4444;         
            --warning: #f59e0b;       
            --text-main: #f8fafc;     
            --text-muted: #cbd5e1;    
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glass-blur: blur(12px);
            --inner-bg: rgba(0, 0, 0, 0.2);
            --input-bg: rgba(255, 255, 255, 0.05);
            --hover-bg: rgba(255, 255, 255, 0.08);
            --blob-1: #38bdf8;
            --blob-2: #818cf8;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body, input, textarea, select, button, div, span, p, h1, h2, h3, h4, h5, h6, th, td { 
            font-family: 'Tajawal', sans-serif !important;
        }
        
        body {
            background-color: var(--bg-main); 
            color: var(--text-main); 
            overflow-x: hidden;
            position: relative;
        }

        .background-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; }
        
        /* تأثيرات الحركة العشوائية والانقباض والانبساط */
        .blob-1 { 
            width: 40vw; height: 40vw; background: var(--blob-1); top: -10%; right: -10%; 
            animation: moveBlob1 20s infinite alternate ease-in-out;
        }
        .blob-2 { 
            width: 35vw; height: 35vw; background: var(--blob-2); bottom: -10%; left: -5%; 
            animation: moveBlob2 25s infinite alternate ease-in-out; 
        }

        @keyframes moveBlob1 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-15vw, 15vh) scale(1.3); }
            66% { transform: translate(-30vw, -5vh) scale(0.8); }
            100% { transform: translate(-10vw, 25vh) scale(1.1); }
        }

        @keyframes moveBlob2 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(20vw, -15vh) scale(0.75); }
            66% { transform: translate(5vw, -35vh) scale(1.4); }
            100% { transform: translate(25vw, -10vh) scale(0.9); }
        }

        .admin-panel { 
            background: var(--glass-bg); 
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); 
            box-shadow: var(--glass-shadow);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(120,120,120,0.5); }
        
        input[type=number] { -moz-appearance: textfield; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        input:focus, select:focus, textarea:focus, button:focus { outline: none; border-color: var(--primary); }

        .gradient-text {
            background: linear-gradient(to left, var(--primary), var(--blob-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDyzMu-cNcnqjWG34EdBBQAltZz3slemvE",
            authDomain: "warrior-store.firebaseapp.com",
            databaseURL: "https://warrior-store-default-rtdb.firebaseio.com",
            projectId: "warrior-store",
            storageBucket: "warrior-store.firebasestorage.app",
            messagingSenderId: "291818293354",
            appId: "1:291818293354:web:e846aede085e05f690a213"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const auth = firebase.auth();

        let globalDraggedSettingId = null;
        let globalDraggedReqId = null;

        const formatRemainingTime = (totalDays) => {
            if (totalDays <= 0) return 'منتهي';
            let y = Math.floor(totalDays / 365);
            let m = Math.floor((totalDays % 365) / 30);
            let d = Math.floor((totalDays % 365) % 30);
            
            let yStr = y === 1 ? 'سنة' : y === 2 ? 'سنتين' : y >= 3 && y <= 10 ? `${y} سنوات` : y > 10 ? `${y} سنة` : '';
            let mStr = m === 1 ? 'شهر' : m === 2 ? 'شهرين' : m >= 3 && m <= 10 ? `${m} أشهر` : m > 10 ? `${m} شهر` : '';
            let dStr = d === 1 ? 'يوم' : d === 2 ? 'يومين' : d >= 3 && d <= 10 ? `${d} أيام` : d > 10 ? `${d} يوم` : '';
            
            let parts = [yStr, mStr, dStr].filter(Boolean);
            return `متبقي ${parts.join(' و ')}`;
        };

        const calculateProgress = (startDateStr, endDateStr, durationDaysFallback) => {
            if (!startDateStr) return { remaining: 0, percent: 0, expired: true };
            const startDate = new Date(startDateStr);
            let endDate;

            if (endDateStr) {
                endDate = new Date(endDateStr);
            } else if (durationDaysFallback) {
                endDate = new Date(startDate.getTime() + (parseInt(durationDaysFallback) * 24 * 60 * 60 * 1000));
            } else {
                return { remaining: 0, percent: 0, expired: true };
            }

            const today = new Date();
            const diffTime = endDate - today;
            const remainingDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            const totalDiff = endDate - startDate;
            const totalDays = Math.ceil(totalDiff / (1000 * 60 * 60 * 24));

            if (remainingDays <= 0) return { remaining: 0, percent: 0, expired: true };
            const percent = totalDays > 0 ? Math.min(100, Math.max(0, (remainingDays / totalDays) * 100)) : 0;
            return { remaining: remainingDays, percent, expired: false };
        };

        const getCombId = (platformId, planId, typeId, durationId) => {
            return `${platformId || 'null'}___${planId || 'null'}___${typeId || 'null'}___${durationId || 'null'}`;
        };

        const CustomSelect = ({ options, value, onChange, placeholder = "", required, disabled = false, customClass = "p-2.5" }) => {
            const [isOpen, setIsOpen] = React.useState(false);
            const selectRef = React.useRef(null);

            React.useEffect(() => {
                if (!isOpen) return;
                const handleClickOutside = (event) => {
                    if (selectRef.current && !selectRef.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [isOpen]);

            const selectedLabel = value ? options.find(o => String(o.value) === String(value))?.label : placeholder;

            return (
                <div className={`relative w-full h-full ${isOpen ? 'z-[9999]' : 'z-10'}`} ref={selectRef}>
                    {required && <input type="text" required value={value || ''} onChange={()=>{}} className="absolute opacity-0 w-0 h-0 pointer-events-none" />}
                    
                    <div 
                        className={`w-full h-full bg-[var(--input-bg)] border ${isOpen ? 'border-[var(--primary)] shadow-[0_0_12px_rgba(56,189,248,0.2)]' : 'border-[var(--glass-border)]'} text-[var(--text-main)] rounded-xl ${customClass} flex justify-between items-center gap-2 transition-all duration-300 box-border ${disabled ? 'opacity-50 cursor-not-allowed bg-[var(--inner-bg)]' : 'cursor-pointer hover:border-[var(--primary)] hover:bg-[var(--hover-bg)]'}`}
                        onClick={() => !disabled && setIsOpen(!isOpen)}
                    >
                        <span className={`block flex-1 min-w-0 text-right truncate text-sm ${value && value !== 'all' ? 'text-[var(--text-main)] font-bold' : 'text-[var(--text-muted)]'}`} dir="auto">{selectedLabel || placeholder}</span>
                        <i className={`fas fa-chevron-down shrink-0 text-[var(--text-muted)] text-sm transition-transform duration-300 ${isOpen ? 'rotate-180 text-[var(--primary)]' : ''}`}></i>
                    </div>
                    
                    {isOpen && !disabled && (
                        <div className="absolute left-0 right-0 w-full mt-1 bg-[#1e293b] border border-[var(--glass-border)] rounded-xl shadow-[0_15px_40px_rgba(0,0,0,0.6)] overflow-hidden animate-fadeIn top-full text-sm">
                            <div className="max-h-60 overflow-y-auto">
                                {options.length === 0 ? (
                                    <div className="p-3 text-center text-[var(--text-muted)] text-sm font-bold">لا توجد خيارات</div>
                                ) : (
                                    options.map((opt) => (
                                        <div 
                                            key={opt.value}
                                            className={`p-3 transition-colors border-b border-[var(--glass-border)] last:border-0 flex items-center justify-between 
                                                ${opt.disabled ? 'opacity-50 cursor-not-allowed bg-[rgba(0,0,0,0.2)]' : 'cursor-pointer hover:bg-[rgba(255,255,255,0.05)]'} 
                                                ${String(value) === String(opt.value) && !opt.disabled ? 'bg-[rgba(56,189,248,0.15)] text-[var(--primary)] font-bold' : 'text-[var(--text-main)]'}`}
                                            onClick={() => { if(!opt.disabled) { onChange(opt.value); setIsOpen(false); } }}
                                        >
                                            <span dir="auto" className="truncate text-sm font-bold">{opt.label}</span>
                                            {String(value) === String(opt.value) && !opt.disabled && <i className="fas fa-check text-sm text-[var(--primary)] shrink-0 mr-2"></i>}
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CustomDatePicker = ({ value, onChange, disabled }) => {
            const [isOpen, setIsOpen] = React.useState(false);
            const [currentDate, setCurrentDate] = React.useState(value ? new Date(value) : new Date());
            const pickerRef = React.useRef(null);

            React.useEffect(() => {
                if (value) setCurrentDate(new Date(value));
            }, [value]);

            React.useEffect(() => {
                if (!isOpen) return;
                const handleClickOutside = (event) => {
                    if (pickerRef.current && !pickerRef.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [isOpen]);

            const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
            const firstDayOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const dayNames = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

            const handlePrevMonth = (e) => { e.stopPropagation(); setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1)); };
            const handleNextMonth = (e) => { e.stopPropagation(); setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1)); };

            const handleDateClick = (day, e) => {
                e.stopPropagation();
                const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                if (onChange) onChange(`${currentDate.getFullYear()}-${month}-${dayStr}`);
                setIsOpen(false);
            };

            return (
                <div className={`relative w-full h-full ${isOpen ? 'z-[9999]' : 'z-10'}`} ref={pickerRef}>
                    <div 
                        className={`w-full h-full bg-[var(--input-bg)] border ${isOpen ? 'border-[var(--primary)] shadow-[0_0_12px_rgba(56,189,248,0.2)]' : 'border-[var(--glass-border)]'} text-[var(--text-main)] rounded-xl p-3 flex justify-between items-center transition-all duration-300 text-sm ${disabled ? 'opacity-50 cursor-not-allowed bg-[var(--inner-bg)]' : 'cursor-pointer hover:border-[var(--primary)] hover:bg-[var(--hover-bg)]'}`}
                        onClick={() => !disabled && setIsOpen(!isOpen)}
                        dir="ltr"
                    >
                        <span className="text-sm font-bold">{value || 'YYYY-MM-DD'}</span>
                        <i className="fas fa-calendar-alt text-[var(--text-muted)] text-sm"></i>
                    </div>
                    
                    {isOpen && !disabled && (
                        <div className="absolute left-0 right-0 mt-1 p-4 bg-[#1e293b] border border-[var(--glass-border)] rounded-xl shadow-[0_15px_40px_rgba(0,0,0,0.6)] animate-fadeIn z-[9999]" dir="ltr">
                            <div className="flex justify-between items-center mb-4">
                                <button type="button" onClick={handlePrevMonth} className="text-[var(--text-muted)] hover:text-white p-1 transition-colors"><i className="fas fa-chevron-left text-sm"></i></button>
                                <span className="font-bold text-[var(--text-main)] text-sm">{monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}</span>
                                <button type="button" onClick={handleNextMonth} className="text-[var(--text-muted)] hover:text-white p-1 transition-colors"><i className="fas fa-chevron-right text-sm"></i></button>
                            </div>
                            <div className="grid grid-cols-7 gap-1 text-center mb-2 border-b border-[var(--glass-border)] pb-2">
                                {dayNames.map(d => <div key={d} className="text-xs font-bold text-[var(--primary)]">{d}</div>)}
                            </div>
                            <div className="grid grid-cols-7 gap-1 text-center">
                                {Array.from({ length: firstDayOfMonth }).map((_, i) => <div key={`empty-${i}`} />)}
                                {Array.from({ length: daysInMonth }).map((_, i) => {
                                    const day = i + 1;
                                    const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                    const isSelected = value === dateStr;
                                    const isToday = new Date().toISOString().split('T')[0] === dateStr;
                                    
                                    return (
                                        <button 
                                            key={day}
                                            type="button"
                                            onClick={(e) => handleDateClick(day, e)}
                                            className={`w-7 h-7 rounded-full text-xs flex items-center justify-center mx-auto transition-all duration-300 ${isSelected ? 'bg-[var(--primary)] text-white font-bold shadow-[0_0_10px_rgba(56,189,248,0.5)] scale-110' : isToday ? 'border border-[var(--primary)] text-[var(--primary)] font-bold' : 'text-[var(--text-main)] hover:bg-[rgba(255,255,255,0.1)] hover:scale-110'}`}
                                        >
                                            {day}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CustomNumberInput = ({ value, onChange, placeholder = "", min = 0 }) => {
            const handleIncrement = () => onChange(String((parseInt(value || 0) + 1)));
            const handleDecrement = () => onChange(String(Math.max(min, (parseInt(value || 0) - 1))));

            return (
                <div className="flex items-center w-full bg-[var(--input-bg)] border border-[var(--glass-border)] rounded-xl overflow-hidden focus-within:border-[var(--primary)] transition-all duration-300 focus-within:shadow-[0_0_12px_rgba(56,189,248,0.2)]">
                    <button type="button" onClick={handleIncrement} className="px-3 py-2 bg-[var(--inner-bg)] hover:bg-[var(--primary)] hover:text-white transition-colors border-l border-[var(--glass-border)] text-[var(--text-muted)]">
                        <i className="fas fa-plus text-xs"></i>
                    </button>
                    <input 
                        type="number" 
                        value={value === 0 ? "0" : (value || '')} 
                        onChange={(e) => onChange(e.target.value)} 
                        className="w-full text-center bg-transparent text-[var(--text-main)] outline-none font-bold p-1 text-sm"
                        placeholder={placeholder}
                    />
                    <button type="button" onClick={handleDecrement} className="px-3 py-2 bg-[var(--inner-bg)] hover:bg-[var(--error)] hover:text-white transition-colors border-r border-[var(--glass-border)] text-[var(--text-muted)]">
                        <i className="fas fa-minus text-xs"></i>
                    </button>
                </div>
            );
        };

        const CombToggle = ({ id, label, checked, onChange, icon, disabled, onReorder }) => {
            return (
                <div 
                    draggable={!disabled}
                    onDragStart={(e) => {
                        globalDraggedReqId = id;
                        e.dataTransfer.effectAllowed = "move";
                        e.dataTransfer.setData('text/plain', id);
                    }}
                    onDragEnter={(e) => {
                        e.preventDefault();
                        if (globalDraggedReqId && globalDraggedReqId !== id && !disabled) {
                            onReorder(globalDraggedReqId, id);
                        }
                    }}
                    onDragOver={(e) => e.preventDefault()}
                    onDragEnd={() => { globalDraggedReqId = null; }}
                    className={`flex items-center justify-between p-3 bg-[var(--inner-bg)] border rounded-2xl transition-all shadow-sm group relative ${disabled ? 'opacity-50 border-[var(--glass-border)]' : 'hover:border-[var(--primary)] hover:bg-[var(--input-bg)] border-[var(--glass-border)]'}`}
                >
                    <label className={`flex-1 flex items-center justify-between min-w-0 pl-2 ${disabled ? 'cursor-not-allowed' : 'cursor-pointer'}`}>
                        <input 
                            type="checkbox" 
                            className="hidden" 
                            checked={checked || false} 
                            onChange={(e) => { if (!disabled) onChange(e.target.checked); }} 
                            disabled={disabled}
                        />
                        <span className="font-bold text-[var(--text-main)] text-sm flex items-center gap-2 truncate flex-1 pr-1">
                            {icon && <i className={`${icon} text-[var(--text-muted)] ${!disabled ? 'group-hover:text-[var(--primary)]' : ''} transition-colors w-5 text-center text-sm`}></i>}
                            <span className="truncate">{label}</span>
                        </span>
                        <div className={`shrink-0 w-12 h-6 flex items-center rounded-full p-1 transition-colors duration-300 ${checked ? 'bg-[var(--primary)] shadow-[0_0_10px_rgba(56,189,248,0.3)]' : 'bg-[rgba(255,255,255,0.1)] border border-[var(--glass-border)]'}`}>
                            <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform duration-300 ${checked ? '-translate-x-6' : 'translate-x-0'}`}></div>
                        </div>
                    </label>
                </div>
            );
        };

        const SettingListItem = ({ item, path, onDelete, onEditClick, onReorder, isSelected, onClick, isBeingEdited }) => {
            let selectedClasses = isSelected 
                ? 'bg-[rgba(56,189,248,0.15)] border-[var(--primary)] text-[var(--primary)] shadow-[0_4px_12px_rgba(56,189,248,0.1)]' 
                : 'bg-[var(--inner-bg)] border-[var(--glass-border)] hover:bg-[var(--hover-bg)]';

            if (isBeingEdited) {
                selectedClasses = 'bg-[rgba(245,158,11,0.15)] border-[var(--warning)] text-[var(--warning)] shadow-[0_4px_12px_rgba(245,158,11,0.1)]';
            }

            return (
                <div 
                    draggable={!isBeingEdited}
                    onDragStart={(e) => {
                        globalDraggedSettingId = item.id;
                        e.dataTransfer.effectAllowed = "move";
                        e.dataTransfer.setData('text/plain', item.id);
                    }}
                    onDragEnter={(e) => {
                        e.preventDefault();
                        if (globalDraggedSettingId && globalDraggedSettingId !== item.id) {
                            onReorder(path, globalDraggedSettingId, item.id);
                        }
                    }}
                    onDragOver={(e) => e.preventDefault()}
                    onDragEnd={() => { globalDraggedSettingId = null; }}
                    onClick={onClick} 
                    className={`flex items-center p-2.5 border rounded-xl cursor-pointer transition-all duration-300 mb-2 box-border px-3 ${selectedClasses}`}
                >
                    {path === 'platforms' && item.imageUrl && (
                        <img src={item.imageUrl} alt={item.label} className="w-6 h-6 rounded-md object-cover ml-2 border border-[var(--glass-border)] shrink-0" />
                    )}
                    <span className="font-bold flex-1 min-w-0 truncate text-sm" title={item.label}>{item.label}</span>
                    <div className="flex items-center gap-2 shrink-0 opacity-70 hover:opacity-100 transition-opacity pr-1">
                        <button onClick={(e) => { e.stopPropagation(); onEditClick(item, path); }} className={`p-1 transition-colors text-sm ${isBeingEdited ? 'text-[var(--warning)]' : 'text-[var(--text-muted)] hover:text-[var(--warning)]'}`}><i className="fas fa-edit"></i></button>
                        <button onClick={(e) => { e.stopPropagation(); onDelete(path, item.id); }} className="text-[var(--text-muted)] hover:text-[var(--error)] transition-colors p-1 text-sm"><i className="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            );
        };

        const LoginScreen = ({ auth }) => {
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                setIsLoading(true);
                setError('');
                auth.signInWithEmailAndPassword(email, password)
                    .catch(err => {
                        setError('بيانات الدخول غير صحيحة.');
                        setIsLoading(false);
                    });
            };

            return (
                <div className="flex items-center justify-center h-screen w-full relative z-10 p-4">
                    <div className="admin-panel p-8 rounded-3xl w-full max-w-md shadow-2xl flex flex-col gap-6 animate-fadeIn">
                        <div className="text-center">
                            <div className="w-20 h-20 rounded-2xl bg-[rgba(56,189,248,0.15)] border border-[rgba(56,189,248,0.3)] flex justify-center items-center mx-auto mb-4 shadow-[0_0_15px_rgba(56,189,248,0.2)]">
                                <i className="fas fa-user-shield text-4xl text-[var(--primary)]"></i>
                            </div>
                            <h2 className="text-2xl font-bold text-[var(--text-main)] mb-1">تسجيل الدخول</h2>
                            <p className="text-[var(--text-muted)] text-sm font-bold">أدخل بيانات المدير للوصول للوحة التحكم</p>
                        </div>
                        {error && (
                            <div className="bg-[rgba(239,68,68,0.15)] border border-[var(--error)] text-[var(--error)] p-3 rounded-xl text-sm font-bold text-center">
                                <i className="fas fa-exclamation-circle mr-1"></i> {error}
                            </div>
                        )}
                        <form onSubmit={handleLogin} className="flex flex-col gap-4">
                            <div>
                                <label className="block text-sm font-bold text-[var(--text-main)] mb-2">البريد الإلكتروني</label>
                                <input type="email" required dir="ltr" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-[var(--input-bg)] border border-[var(--glass-border)] text-[var(--text-main)] rounded-xl p-3 outline-none focus:border-[var(--primary)] focus:shadow-[0_0_10px_rgba(56,189,248,0.2)] transition-all text-sm font-bold" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-[var(--text-main)] mb-2">كلمة المرور</label>
                                <input type="password" required dir="ltr" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-[var(--input-bg)] border border-[var(--glass-border)] text-[var(--text-main)] rounded-xl p-3 outline-none focus:border-[var(--primary)] focus:shadow-[0_0_10px_rgba(56,189,248,0.2)] transition-all text-sm font-bold" />
                            </div>
                            <button type="submit" disabled={isLoading} className="w-full mt-2 bg-gradient-to-l from-[var(--primary)] to-[var(--primary-hover)] text-white p-3 rounded-xl transition-all shadow-md font-bold text-base hover:-translate-y-0.5 disabled:opacity-50">
                                {isLoading ? <i className="fas fa-spinner fa-spin text-lg"></i> : 'دخول'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        function MainApp({ user }) {
            const [confirmDialog, setConfirmDialog] = React.useState({ isOpen: false, message: '', onConfirm: null });
            const [noteDialog, setNoteDialog] = React.useState({ isOpen: false, text: '' });
            const [activeTab, setActiveTab] = React.useState('requests');
            const [accounts, setAccounts] = React.useState([]);
            const [requests, setRequests] = React.useState([]);
            const [emailsData, setEmailsData] = React.useState([]);
            const [isFetchingEmails, setIsFetchingEmails] = React.useState(false);
            const [expandedEmailId, setExpandedEmailId] = React.useState(null);
            
            const [emailCreds, setEmailCreds] = React.useState([]);
            const [newCredEmail, setNewCredEmail] = React.useState('');
            const [newCredPass, setNewCredPass] = React.useState('');
            const [isAddEmailModalOpen, setIsAddEmailModalOpen] = React.useState(false);
            
            const [settings, setSettings] = React.useState({ platforms: [], plans: [], subTypes: [], durations: [], combinationFields: {}, requirementsOrder: [] });
            
            const [selectedPlatformId, setSelectedPlatformId] = React.useState(null);
            const [selectedPlanId, setSelectedPlanId] = React.useState(null);
            const [selectedTypeId, setSelectedTypeId] = React.useState(null);
            const [selectedDurationId, setSelectedDurationId] = React.useState(null);

            const selectedSettingPlatform = settings.platforms.find(p => p.id === selectedPlatformId)?.label || null;
            const selectedSettingPlan = settings.plans.find(p => p.id === selectedPlanId)?.label || null;
            const selectedSettingType = settings.subTypes.find(s => s.id === selectedTypeId)?.label || null;
            const selectedSettingDuration = settings.durations.find(d => d.id === selectedDurationId)?.label || null;
            
            const [editTarget, setEditTarget] = React.useState({ path: null, id: null });

            const [newPlatformName, setNewPlatformName] = React.useState('');
            const [newPlatformUrl, setNewPlatformUrl] = React.useState('');
            const [newPlanName, setNewPlanName] = React.useState('');
            const [newTypeName, setNewTypeName] = React.useState('');
            
            const [newDurLabel, setNewDurLabel] = React.useState('');
            const [newDurVal, setNewDurVal] = React.useState('');
            const [newDurUnit, setNewDurUnit] = React.useState('days');
            const [newWarVal, setNewWarVal] = React.useState('');
            const [newWarUnit, setNewWarUnit] = React.useState('days');

            const [localDeliveryMsg, setLocalDeliveryMsg] = React.useState('');
            const localDeliveryMsgRef = React.useRef(null);

            const [filters, setFilters] = React.useState({
                requests: { platform: 'all', plan: 'all', account: 'all', subType: 'all', status: 'all', search: '' },
                accounts: { platform: 'all', plan: 'all', status: 'all', search: '' }
            });

            const currentFilters = (activeTab === 'settings' || activeTab === 'emails') ? {} : filters[activeTab];
            const setF = (key, val) => setFilters(p => ({ ...p, [activeTab]: { ...p[activeTab], [key]: val } }));
            const clearF = () => setFilters(p => ({ ...p, [activeTab]: { platform: 'all', plan: 'all', account: 'all', subType: 'all', status: 'all', search: '' } }));
            const hasFilters = (activeTab !== 'settings' && activeTab !== 'emails') && Object.values(currentFilters).some(v => v !== 'all' && v !== '');

            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [modalType, setModalType] = React.useState('');
            const [reqStep, setReqStep] = React.useState('select'); 
            const [formData, setFormData] = React.useState({});

            const defaultReqsConfig = [
                { id: 'reqAccount', icon: 'fas fa-link', label: 'ربط بحساب' },
                { id: 'reqProfilePos', icon: 'fas fa-sort-numeric-up', label: 'موضع الملف' },
                { id: 'reqPhone', icon: 'fas fa-mobile-alt', label: 'رقم الجوال' }
            ];

            React.useEffect(() => {
                const accountsRef = database.ref('accounts');
                const requestsRef = database.ref('requests');
                const settingsRef = database.ref('settings');
                const credsRef = database.ref('emails/credentials');

                accountsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    setAccounts(data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : []);
                });
                
                requestsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    setRequests(data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : []);
                });

                settingsRef.on('value', snap => {
                    const data = snap.val() || {};
                    const formatData = (obj) => {
                        let arr = obj ? Object.keys(obj).map(id => ({ id, ...obj[id] })) : [];
                        arr = arr.map((item, idx) => ({ ...item, order: item.order !== undefined ? item.order : idx }));
                        return arr.sort((a, b) => a.order - b.order);
                    };

                    setSettings({
                        platforms: formatData(data.platforms),
                        plans: formatData(data.plans),
                        subTypes: formatData(data.subscriptionTypes),
                        durations: formatData(data.durations),
                        combinationFields: data.combinationFields || {},
                        requirementsOrder: data.requirementsOrder || []
                    });
                });

                credsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    setEmailCreds(data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : []);
                });

                return () => {
                    accountsRef.off('value');
                    requestsRef.off('value');
                    settingsRef.off('value');
                    credsRef.off('value');
                }
            }, []);

            React.useEffect(() => {
                if (selectedPlatformId && selectedPlanId && selectedTypeId && selectedDurationId) {
                    const combId = getCombId(selectedPlatformId, selectedPlanId, selectedTypeId, selectedDurationId);
                    const msg = settings.combinationFields[combId]?.deliveryMessage || "";
                    setLocalDeliveryMsg(msg);
                } else {
                    setLocalDeliveryMsg("");
                }
            }, [selectedPlatformId, selectedPlanId, selectedTypeId, selectedDurationId, settings.combinationFields]);

            React.useEffect(() => {
                let emailsRef;
                if (activeTab === 'emails') {
                    setIsFetchingEmails(true);
                    emailsRef = database.ref('emails/inbox');
                    emailsRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const parsedEmails = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a, b) => new Date(b.date) - new Date(a.date));
                            setEmailsData(parsedEmails);
                        } else {
                            setEmailsData([]);
                        }
                        setIsFetchingEmails(false);
                    });
                }
                return () => {
                    if (emailsRef) {
                        emailsRef.off('value');
                    }
                };
            }, [activeTab]);

            const timeAgoFormatter = (dateStr) => {
                const date = new Date(dateStr);
                const seconds = Math.floor((new Date() - date) / 1000);
                let interval = Math.floor(seconds / 31536000);
                if (interval >= 1) return interval === 1 ? "سنة" : interval === 2 ? "سنتين" : interval + " سنوات";
                interval = Math.floor(seconds / 2592000);
                if (interval >= 1) return interval === 1 ? "شهر" : interval === 2 ? "شهرين" : interval + " أشهر";
                interval = Math.floor(seconds / 86400);
                if (interval >= 1) return interval === 1 ? "يوم" : interval === 2 ? "يومين" : interval + " أيام";
                interval = Math.floor(seconds / 3600);
                if (interval >= 1) return interval === 1 ? "ساعة" : interval === 2 ? "ساعتين" : interval + " ساعات";
                interval = Math.floor(seconds / 60);
                if (interval >= 1) return interval === 1 ? "دقيقة" : interval === 2 ? "دقيقتين" : interval + " دقائق";
                return "الآن";
            };

            React.useEffect(() => {
                if (activeTab === 'requests' && formData.startDate && (formData.durVal !== undefined)) {
                    const d = new Date(formData.startDate);
                    if (formData.durUnit === 'months') {
                        d.setMonth(d.getMonth() + (parseInt(formData.durVal) || 0));
                    } else {
                        d.setDate(d.getDate() + (parseInt(formData.durVal) || 0));
                    }
                    const calculatedEndDate = d.toISOString().split('T')[0];
                    if (formData.endDate !== calculatedEndDate) {
                        setFormData(prev => ({ ...prev, endDate: calculatedEndDate }));
                    }
                }
            }, [formData.startDate, formData.durVal, formData.durUnit, activeTab]);

            const filterData = (dataArray) => {
                if (!currentFilters) return dataArray;
                let filtered = dataArray;
                
                if (currentFilters.status !== 'all') {
                    filtered = filtered.filter(item => {
                        const prog = calculateProgress(item.startDate, item.endDate);
                        if (currentFilters.status === 'active') return !prog.expired;
                        if (currentFilters.status === 'expired') return prog.expired;
                        return true;
                    });
                }

                if (currentFilters.platform !== 'all') {
                    filtered = filtered.filter(item => {
                        const pId = item.platformId || settings.platforms.find(p => p.label === item.platform)?.id;
                        return pId === currentFilters.platform;
                    });
                }
                
                if (currentFilters.plan !== 'all') {
                    if (activeTab === 'accounts') {
                        filtered = filtered.filter(item => {
                            const pId = item.planId || settings.plans.find(p => p.label === item.plan && (p.platformId === item.platformId || p.platformName === item.platform))?.id;
                            return pId === currentFilters.plan;
                        });
                    } else if (activeTab === 'requests') {
                        filtered = filtered.filter(item => {
                            let pId = item.planId;
                            if (!pId) {
                                if (item.plan && item.plan !== '-') {
                                    pId = settings.plans.find(p => p.label === item.plan && (p.platformId === item.platformId || p.platformName === item.platform))?.id;
                                } else {
                                    const reqAccount = accounts.find(a => a.id === item.accountId);
                                    pId = reqAccount?.planId || settings.plans.find(p => p.label === reqAccount?.plan && (p.platformId === reqAccount?.platformId || p.platformName === reqAccount?.platform))?.id;
                                }
                            }
                            return pId === currentFilters.plan;
                        });
                    }
                }
                
                if (currentFilters.account !== 'all' && currentFilters.account !== undefined && activeTab === 'requests') {
                    filtered = filtered.filter(item => item.accountId === currentFilters.account);
                }

                if (currentFilters.subType !== 'all' && currentFilters.subType !== undefined && activeTab === 'requests') {
                    filtered = filtered.filter(item => {
                        const sId = item.subscriptionTypeId || settings.subTypes.find(s => s.label === item.subscriptionType && (s.planId === item.planId || s.planName === item.plan))?.id;
                        return sId === currentFilters.subType;
                    });
                }
                
                if (currentFilters.search) {
                    filtered = filtered.filter(item => 
                        Object.values(item).some(val => String(val).toLowerCase().includes(currentFilters.search.toLowerCase()))
                    );
                }
                return filtered;
            };

            const processAndSortData = (dataArray) => {
                let filtered = filterData(dataArray);
                
                filtered.sort((a, b) => {
                    if (currentFilters?.status === 'expired') {
                        const dateA = new Date(a.endDate || 0).getTime();
                        const dateB = new Date(b.endDate || 0).getTime();
                        if (dateB !== dateA) return dateB - dateA;
                        return a.id > b.id ? -1 : (a.id < b.id ? 1 : 0);
                    } else {
                        const dateA = new Date(a.startDate || 0).getTime();
                        const dateB = new Date(b.startDate || 0).getTime();
                        if (dateB !== dateA) return dateB - dateA;
                        return a.id > b.id ? -1 : (a.id < b.id ? 1 : 0);
                    }
                });
                return filtered;
            };

            const filteredAccounts = React.useMemo(() => processAndSortData(accounts), [accounts, currentFilters, activeTab, settings]);
            const filteredRequests = React.useMemo(() => processAndSortData(requests), [requests, currentFilters, activeTab, settings]);

            const handleSave = (e) => {
                e.preventDefault();
                const path = activeTab; 
                
                let finalData = { ...formData };
                const keysToReplace = ['email', 'password', 'phoneNumber', 'profileName', 'profilePin', 'profilePosition', 'accountId'];
                keysToReplace.forEach(key => {
                    if (finalData[key] === '' || finalData[key] === undefined || finalData[key] === null) {
                        finalData[key] = '-';
                    }
                });
                
                if (finalData.amountPaid) {
                    localStorage.setItem('lastAmountPaid', finalData.amountPaid);
                }

                if (modalType === 'add') {
                    const newRef = database.ref(path).push();
                    newRef.set({ ...finalData, key: newRef.key });
                } else if (modalType === 'edit') {
                    if (path === 'accounts') {
                        const updates = {};
                        updates[`${path}/${finalData.id}`] = finalData;
                        
                        const linkedRequests = requests.filter(r => r.accountId === finalData.id);
                        linkedRequests.forEach(req => {
                            let updatedName = '-';
                            let updatedPin = '-';
                            
                            let prof = finalData.profiles ? finalData.profiles.find(p => p.id === req.profilePosition) : null;
                            if (!prof && req.profilePosition && req.profilePosition.length < 5 && finalData.profiles) {
                                prof = finalData.profiles[parseInt(req.profilePosition) - 1]; 
                            }

                            if (prof) {
                                updatedName = prof.name || '-';
                                updatedPin = prof.pin || '-';
                                updates[`requests/${req.id}/profilePosition`] = prof.id; 
                            } else {
                                updates[`requests/${req.id}/profilePosition`] = '';
                                updatedName = '-';
                                updatedPin = '-';
                            }
                            
                            updates[`requests/${req.id}/profileName`] = updatedName;
                            updates[`requests/${req.id}/profilePin`] = updatedPin;
                        });
                        database.ref().update(updates);
                    } else {
                        database.ref(`${path}/${finalData.id}`).update(finalData);
                    }
                }
                setIsModalOpen(false);
                setFormData({});
            };

            const handleDelete = (id) => {
                setConfirmDialog({
                    isOpen: true,
                    message: activeTab === 'accounts' ? 'تأكيد الحذف نهائياً (سيتم تصفير ارتباط الحساب في الطلبات المتعلقة به)' : 'تأكيد الحذف نهائياً',
                    onConfirm: () => {
                        const updates = {};
                        updates[`${activeTab}/${id}`] = null;
                        
                        if (activeTab === 'accounts') {
                            const linkedRequests = requests.filter(r => r.accountId === id);
                            linkedRequests.forEach(req => {
                                updates[`requests/${req.id}/accountId`] = '-';
                                updates[`requests/${req.id}/profileName`] = '-';
                                updates[`requests/${req.id}/profilePin`] = '-';
                                updates[`requests/${req.id}/profilePosition`] = '';
                            });
                        }
                        
                        database.ref().update(updates);
                    }
                });
            };

            const openModal = (type, data = {}) => {
                setModalType(type);
                setReqStep(activeTab === 'requests' && type === 'add' ? 'select' : 'fill_data');
                let initData = { ...data };
                
                if (type === 'add') {
                    initData.startDate = new Date().toISOString().split('T')[0];
                    initData.profileName = '';
                    initData.profilePin = '';
                    if (activeTab === 'requests') {
                        initData.phoneNumber = initData.phoneNumber || "";
                        initData.warrantyVal = initData.warrantyVal !== undefined ? initData.warrantyVal : ""; 
                        initData.warrantyUnit = initData.warrantyUnit || "days";
                        initData.amountPaid = initData.amountPaid !== undefined ? initData.amountPaid : (localStorage.getItem('lastAmountPaid') || "");
                    }
                    if (activeTab === 'accounts') {
                        initData.profiles = [];
                    }
                } else if (type === 'edit') {
                    Object.keys(initData).forEach(key => {
                        if (initData[key] === '-') initData[key] = '';
                    });
                    
                    initData.platformId = initData.platformId || settings.platforms.find(p => p.label === initData.platform)?.id || '';
                    initData.planId = initData.planId || settings.plans.find(p => p.label === initData.plan && (p.platformId === initData.platformId || p.platformName === initData.platform))?.id || '';
                }
                
                setFormData(initData);
                setIsModalOpen(true);
            };

            const handleDuplicate = (item) => {
                const duplicatedItem = { ...item };
                delete duplicatedItem.id;
                delete duplicatedItem.key;
                openModal('add', duplicatedItem);
                if (activeTab === 'requests') {
                    setReqStep('fill_data');
                }
            };

            const handleCopy = (text) => { if(text && text !== '-') navigator.clipboard.writeText(text); };
            const handleWhatsApp = (phone) => { if(phone && phone !== '-') window.open(`https://api.whatsapp.com/send?phone=${phone.replace(/\D/g, '')}`, '_blank'); };

            const handleCancelEdit = () => {
                setEditTarget({path: null, id: null});
                setNewPlatformName('');
                setNewPlatformUrl('');
                setNewPlanName('');
                setNewTypeName('');
                setNewDurLabel('');
                setNewDurVal('');
                setNewDurUnit('days');
                setNewWarVal('');
                setNewWarUnit('days');
            };

            const handleEditClick = (item, path) => {
                setEditTarget({ path, id: item.id });
                if (path === 'platforms') {
                    setNewPlatformName(item.label);
                    setNewPlatformUrl(item.imageUrl || '');
                } else if (path === 'plans') {
                    setNewPlanName(item.label);
                } else if (path === 'subscriptionTypes') {
                    setNewTypeName(item.label);
                } else if (path === 'durations') {
                    setNewDurLabel(item.label);
                    setNewDurVal(item.durVal || item.durMonths || item.durDays || '');
                    setNewDurUnit(item.durUnit || (item.durMonths ? 'months' : 'days'));
                    setNewWarVal(item.warrantyVal || '');
                    setNewWarUnit(item.warrantyUnit || 'days');
                }
            };

            const handleAddOrEditSetting = async (e, path, extraData = {}) => {
                e.preventDefault();
                let newValue = '';
                
                if (path === 'platforms') {
                    if (!newPlatformName.trim()) return;
                    newValue = newPlatformName.trim();
                    extraData.imageUrl = newPlatformUrl.trim();
                } else if (path === 'plans') {
                    if (!newPlanName.trim()) return;
                    newValue = newPlanName.trim();
                } else if (path === 'subscriptionTypes') {
                    if(!newTypeName.trim()) return;
                    newValue = newTypeName.trim();
                }

                if (editTarget.id && editTarget.path === path) {
                    let itemsList = [];
                    if (path === 'platforms') itemsList = settings.platforms;
                    if (path === 'plans') itemsList = settings.plans;
                    if (path === 'subscriptionTypes') itemsList = settings.subTypes;
                    
                    const item = itemsList.find(i => i.id === editTarget.id);
                    if (item) {
                        await processEditSetting(path, item, newValue, extraData);
                    }
                    handleCancelEdit();
                } else {
                    database.ref(`settings/${path}`).push({ 
                        label: newValue, 
                        value: newValue, 
                        order: Date.now(), 
                        ...extraData 
                    });
                    if (path === 'platforms') { setNewPlatformName(''); setNewPlatformUrl(''); }
                    if (path === 'plans') { setNewPlanName(''); }
                    if (path === 'subscriptionTypes') { setNewTypeName(''); }
                }
            };

            const handleAddOrEditDuration = async (e) => {
                e.preventDefault();
                if (!newDurLabel.trim() || !selectedSettingType) return;
                
                const durData = {
                    durVal: parseInt(newDurVal) || 0,
                    durUnit: newDurUnit,
                    warrantyVal: parseInt(newWarVal) || 0,
                    warrantyUnit: newWarUnit
                };

                if (editTarget.id && editTarget.path === 'durations') {
                    const item = settings.durations.find(i => i.id === editTarget.id);
                    if (item) {
                        await processEditSetting('durations', item, newDurLabel.trim(), durData);
                    }
                    handleCancelEdit();
                } else {
                    database.ref(`settings/durations`).push({
                        label: newDurLabel.trim(),
                        value: newDurLabel.trim(),
                        ...durData,
                        typeName: selectedSettingType,
                        typeId: selectedTypeId,
                        planName: selectedSettingPlan,
                        planId: selectedPlanId,
                        platformName: selectedSettingPlatform,
                        platformId: selectedPlatformId,
                        order: Date.now()
                    });
                    handleCancelEdit(); 
                }
            };

            const handleDeleteSetting = (path, id) => {
                setConfirmDialog({
                    isOpen: true,
                    message: 'تأكيد الحذف (سيتم حذف أي بيانات فرعية ورسائل التسليم المرتبطة بها نهائياً)',
                    onConfirm: () => {
                        const updates = {};
                        updates[`settings/${path}/${id}`] = null;

                        if (path === 'platforms') {
                            settings.plans.filter(p => p.platformId === id).forEach(p => updates[`settings/plans/${p.id}`] = null);
                            settings.subTypes.filter(s => s.platformId === id).forEach(s => updates[`settings/subscriptionTypes/${s.id}`] = null);
                            settings.durations.filter(d => d.platformId === id).forEach(d => updates[`settings/durations/${d.id}`] = null);
                            if(selectedPlatformId === id) { setSelectedPlatformId(null); setSelectedPlanId(null); setSelectedTypeId(null); setSelectedDurationId(null); }
                        } else if (path === 'plans') {
                            settings.subTypes.filter(s => s.planId === id).forEach(s => updates[`settings/subscriptionTypes/${s.id}`] = null);
                            settings.durations.filter(d => d.planId === id).forEach(d => updates[`settings/durations/${d.id}`] = null);
                            if(selectedPlanId === id) { setSelectedPlanId(null); setSelectedTypeId(null); setSelectedDurationId(null); }
                        } else if (path === 'subscriptionTypes') {
                            settings.durations.filter(d => d.typeId === id).forEach(d => updates[`settings/durations/${d.id}`] = null);
                            if(selectedTypeId === id) { setSelectedTypeId(null); setSelectedDurationId(null); }
                        } else if (path === 'durations') {
                            if(selectedDurationId === id) setSelectedDurationId(null);
                        }

                        Object.keys(settings.combinationFields || {}).forEach(combId => {
                            if (combId.includes(id)) updates[`settings/combinationFields/${combId}`] = null;
                        });

                        database.ref().update(updates);
                        if (editTarget.id === id) handleCancelEdit();
                    }
                });
            };

            const processEditSetting = async (path, item, newValue, extraData = {}) => {
                const updates = {};
                updates[`settings/${path}/${item.id}/label`] = newValue;
                updates[`settings/${path}/${item.id}/value`] = newValue;
                
                if (extraData && extraData.imageUrl !== undefined) updates[`settings/${path}/${item.id}/imageUrl`] = extraData.imageUrl;
                if (extraData && extraData.durVal !== undefined) updates[`settings/${path}/${item.id}/durVal`] = extraData.durVal;
                if (extraData && extraData.durUnit !== undefined) updates[`settings/${path}/${item.id}/durUnit`] = extraData.durUnit;
                if (extraData && extraData.warrantyVal !== undefined) updates[`settings/${path}/${item.id}/warrantyVal`] = extraData.warrantyVal;
                if (extraData && extraData.warrantyUnit !== undefined) updates[`settings/${path}/${item.id}/warrantyUnit`] = extraData.warrantyUnit;

                const oldLabel = item.label;

                if (path === 'platforms') {
                    settings.plans.forEach(plan => { if (plan.platformId === item.id) updates[`settings/plans/${plan.id}/platformName`] = newValue; });
                    settings.subTypes.forEach(sub => { if (sub.platformId === item.id) updates[`settings/subscriptionTypes/${sub.id}/platformName`] = newValue; });
                    settings.durations.forEach(dur => { if (dur.platformId === item.id) updates[`settings/durations/${dur.id}/platformName`] = newValue; });
                    accounts.forEach(acc => { if (acc.platform === oldLabel) updates[`accounts/${acc.id}/platform`] = newValue; });
                    requests.forEach(req => { if (req.platform === oldLabel) updates[`requests/${req.id}/platform`] = newValue; });
                } else if (path === 'plans') {
                    settings.subTypes.forEach(sub => { if (sub.planId === item.id) updates[`settings/subscriptionTypes/${sub.id}/planName`] = newValue; });
                    settings.durations.forEach(dur => { if (dur.planId === item.id) updates[`settings/durations/${dur.id}/planName`] = newValue; });
                    accounts.forEach(acc => { if (acc.plan === oldLabel && acc.platform === selectedSettingPlatform) updates[`accounts/${acc.id}/plan`] = newValue; });
                    requests.forEach(req => { if (req.plan === oldLabel && req.platform === selectedSettingPlatform) updates[`requests/${req.id}/plan`] = newValue; });
                } else if (path === 'subscriptionTypes') {
                    settings.durations.forEach(dur => { if (dur.typeId === item.id) updates[`settings/durations/${dur.id}/typeName`] = newValue; });
                    requests.forEach(req => { if (req.subscriptionType === oldLabel && req.plan === selectedSettingPlan && req.platform === selectedSettingPlatform) updates[`requests/${req.id}/subscriptionType`] = newValue; });
                } else if (path === 'durations') {
                    requests.forEach(req => {
                        if (req.durationLabel === oldLabel && req.subscriptionType === selectedSettingType && req.plan === selectedSettingPlan && req.platform === selectedSettingPlatform) {
                            updates[`requests/${req.id}/durationLabel`] = newValue;
                        }
                    });
                }
                
                try {
                    await database.ref().update(updates);
                } catch (error) {
                    console.error(error);
                }
            };

            const handleReorderSetting = (path, draggedId, targetId) => {
                if (draggedId === targetId) return;

                let currentList = [];
                if (path === 'platforms') currentList = [...settings.platforms];
                else if (path === 'plans') currentList = settings.plans.filter(p => p.platformId ? p.platformId === selectedPlatformId : p.platformName === selectedSettingPlatform);
                else if (path === 'subscriptionTypes') currentList = settings.subTypes.filter(s => s.planId ? s.planId === selectedPlanId : (s.planName === selectedSettingPlan && s.platformName === selectedSettingPlatform));
                else if (path === 'durations') currentList = settings.durations.filter(d => d.typeId ? d.typeId === selectedTypeId : (d.typeName === selectedSettingType && d.planName === selectedSettingPlan && d.platformName === selectedSettingPlatform));

                const draggedIndex = currentList.findIndex(x => x.id === draggedId);
                const targetIndex = currentList.findIndex(x => x.id === targetId);

                if (draggedIndex === -1 || targetIndex === -1) return;

                const newList = [...currentList];
                const [removed] = newList.splice(draggedIndex, 1);
                newList.splice(targetIndex, 0, removed);

                const updates = {};
                newList.forEach((item, index) => {
