                                                        <>
                                                            <i className="fas fa-chevron-left text-[var(--text-muted)] text-sm opacity-50"></i>
                                                            <span className="text-[var(--success)] flex items-center gap-2 drop-shadow-[0_0_5px_rgba(16,185,129,0.3)] text-sm"><i className="fas fa-calendar-alt text-sm"></i> {formData.durationLabel}</span>
                                                        </>
                                                    )}
                                                </div>

                                                <div className="col-span-1 md:col-span-2 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                                                {displayReqs.map(req => {
                                                    if (!reqConfigForm[req.id]) return null;
                                                    
                                                    switch(req.id) {
                                                        case 'reqAccount':
                                                            return (
                                                                <div key={req.id} className="col-span-1 sm:col-span-2 lg:col-span-1 relative z-[79]">
                                                                    <label className="block text-sm font-bold text-[var(--text-main)] mb-2">الحساب</label>
                                                                    <div className="h-[46px]">
                                                                    {(() => {
                                                                        const availableAccounts = accounts.filter(a => a.platformId === formData.platformId && a.planId === formData.planId);
                                                                        const accountOptions = availableAccounts.map(a => ({
                                                                            label: `${a.email || ''}`,
                                                                            value: a.id
                                                                        }));
                                                                        return (
                                                                            <CustomSelect 
                                                                                options={accountOptions} 
                                                                                value={formData.accountId} 
                                                                                onChange={(val) => setFormData({...formData, accountId: val, profilePosition: '', profileName: '', profilePin: ''})} 
                                                                                required={true}
                                                                                customClass="px-3 h-full text-sm font-bold"
                                                                            />
                                                                        );
                                                                    })()}
                                                                    </div>
                                                                </div>
                                                            );
                                                        case 'reqProfilePos':
                                                            return (
                                                                <div key={req.id} className="col-span-1 relative z-[77]">
                                                                    <label className="block text-sm font-bold text-[var(--primary)] mb-2">الملف</label>
                                                                    <div className="h-[46px]">
                                                                    {(() => {
                                                                        let profileOptions = [];
                                                                        if (formData.accountId) {
                                                                            const selAcc = accounts.find(a => a.id === formData.accountId);
                                                                            if (selAcc && selAcc.profiles && selAcc.profiles.length > 0) {
                                                                                selAcc.profiles.forEach((prof, idx) => {
                                                                                    let count = requests.filter(r => r.accountId === formData.accountId && r.id !== formData.id && (r.profilePosition === prof.id || r.profilePosition === String(idx + 1))).length;
                                                                                    profileOptions.push({
                                                                                        label: `${prof.name || ('ملف ' + (idx + 1))} ${count > 0 ? '(بداخله '+count+')' : ''}`,
                                                                                        value: prof.id || String(idx + 1),
                                                                                        disabled: false
                                                                                    });
                                                                                });
                                                                            } else {
                                                                               profileOptions.push({ label: 'لا توجد ملفات', value: '', disabled: true });
                                                                            }
                                                                        }
                                                                        return (
                                                                            <CustomSelect 
                                                                                options={profileOptions} 
                                                                                value={formData.profilePosition} 
                                                                                onChange={(val) => {
                                                                                    const updates = { profilePosition: val, profileName: '', profilePin: '' };
                                                                                    if (formData.accountId) {
                                                                                        const selAcc = accounts.find(a => a.id === formData.accountId);
                                                                                        let prof = selAcc.profiles ? selAcc.profiles.find(p => p.id === val) : null;
                                                                                        if(!prof && selAcc.profiles && val.length < 5) prof = selAcc.profiles[parseInt(val) - 1];
                                                                                        
                                                                                        if (prof) {
                                                                                            if (prof.name) updates.profileName = prof.name;
                                                                                            if (prof.pin) updates.profilePin = prof.pin;
                                                                                        }
                                                                                    }
                                                                                    setFormData({...formData, ...updates});
                                                                                }} 
                                                                                required={true}
                                                                                customClass="px-3 h-full text-sm font-bold"
                                                                            />
                                                                        );
                                                                    })()}
                                                                    </div>
                                                                </div>
                                                            );
                                                        case 'reqPhone':
                                                            return (
                                                                <div key={req.id} className="col-span-1">
                                                                    <label className="block text-sm font-bold text-[var(--text-main)] mb-2">الجوال</label>
                                                                    <div className="flex h-[46px] border border-[var(--glass-border)] bg-[var(--input-bg)] rounded-xl overflow-hidden focus-within:border-[var(--primary)] focus-within:shadow-[0_0_10px_rgba(56,189,248,0.2)] transition-all text-sm">
                                                                        <input 
                                                                            required 
                                                                            type="tel" 
                                                                            dir="ltr" 
                                                                            value={formData.phoneNumber || ''} 
                                                                            onChange={(e) => {
                                                                                let val = e.target.value.replace(/[^\d+]/g, '');
                                                                                setFormData({...formData, phoneNumber: val});
                                                                            }} 
                                                                            className="w-full p-3 outline-none bg-transparent text-[var(--text-main)] text-sm text-left font-bold" 
                                                                        />
                                                                    </div>
                                                                </div>
                                                            );
                                                        default:
                                                            return null;
                                                    }
                                                })}
                                                </div>
                                                
                                                <div className="col-span-1 mt-1">
                                                    <label className="block text-sm font-bold text-[var(--text-main)] mb-2">المبلغ</label>
                                                    <div className="h-[46px]">
                                                    <CustomNumberInput value={formData.amountPaid} onChange={(val) => setFormData({...formData, amountPaid: val})} />
                                                    </div>
                                                </div>
                                            </>
                                        )}

                                        {activeTab === 'accounts' && (
                                            <>
                                                <div className="col-span-1">
                                                    <label className="block text-sm font-bold text-[var(--text-main)] mb-2">اسم المستخدم</label>
                                                    <input required type="text" dir="ltr" value={formData.email || ''} onChange={(e) => setFormData({...formData, email: e.target.value})} className="w-full bg-[var(--input-bg)] border border-[var(--glass-border)] text-[var(--text-main)] rounded-xl p-3 h-[46px] text-left focus:border-[var(--primary)] focus:shadow-[0_0_10px_rgba(56,189,248,0.2)] outline-none transition-all text-sm font-bold" />
                                                </div>
                                                <div className="col-span-1">
                                                    <label className="block text-sm font-bold text-[var(--text-main)] mb-2">كلمة المرور</label>
                                                    <input type="text" dir="ltr" value={formData.password || ''} onChange={(e) => setFormData({...formData, password: e.target.value})} className="w-full bg-[var(--input-bg)] border border-[var(--glass-border)] text-[var(--text-main)] rounded-xl p-3 h-[46px] text-left focus:border-[var(--primary)] focus:shadow-[0_0_10px_rgba(56,189,248,0.2)] outline-none transition-all text-sm font-bold" />
                                                </div>

                                                <div className="col-span-1 md:col-span-2 mt-2">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <label className="block text-sm font-bold text-[var(--text-main)]">ملفات الحساب</label>
                                                        <button type="button" onClick={() => {
                                                            const newProfiles = [...(formData.profiles || []), { id: Date.now().toString(), name: '', pin: '' }];
                                                            setFormData({...formData, profiles: newProfiles});
                                                        }} className="text-[var(--primary)] hover:text-white text-xs font-bold transition-colors text-sm">
                                                            <i className="fas fa-plus text-sm"></i> إضافة ملف
                                                        </button>
                                                    </div>
                                                    {(formData.profiles || []).map((prof, index) => (
                                                        <div key={prof.id} className="flex items-center gap-1.5 mb-2 bg-[var(--inner-bg)] p-1.5 rounded-xl border border-[var(--glass-border)] transition-all hover:border-[var(--primary)]">
                                                            <div className="flex flex-col gap-0 shrink-0 px-1">
                                                                <button type="button" onClick={() => moveProfile(index, -1)} disabled={index === 0} className="text-[var(--text-muted)] hover:text-[var(--primary)] disabled:opacity-20 transition-opacity p-0.5 leading-none"><i className="fas fa-chevron-up text-[10px]"></i></button>
                                                                <button type="button" onClick={() => moveProfile(index, 1)} disabled={index === (formData.profiles?.length || 0) - 1} className="text-[var(--text-muted)] hover:text-[var(--primary)] disabled:opacity-20 transition-opacity p-0.5 leading-none"><i className="fas fa-chevron-down text-[10px]"></i></button>
                                                            </div>
                                                            <div className="w-[1px] h-6 bg-[var(--glass-border)] mx-1"></div>
                                                            <input type="text" placeholder="الاسم" value={prof.name} onChange={(e) => {
                                                                const newProfiles = [...formData.profiles];
                                                                newProfiles[index].name = e.target.value;
                                                                setFormData({...formData, profiles: newProfiles});
                                                            }} className="w-full flex-1 bg-transparent border-none text-[var(--text-main)] outline-none text-sm px-1 font-bold placeholder:text-[var(--text-muted)] placeholder:font-normal" />
                                                            <div className="w-[1px] h-6 bg-[var(--glass-border)] mx-1"></div>
                                                            <input type="text" dir="ltr" placeholder="الرمز" value={prof.pin} onChange={(e) => {
                                                                const newProfiles = [...formData.profiles];
                                                                newProfiles[index].pin = e.target.value;
                                                                setFormData({...formData, profiles: newProfiles});
                                                            }} className="w-20 bg-transparent border-none text-[var(--text-main)] outline-none text-sm text-center font-bold placeholder:text-[var(--text-muted)] placeholder:font-normal" />
                                                            <div className="w-[1px] h-6 bg-[var(--glass-border)] mx-1"></div>
                                                            <div className="flex gap-1 shrink-0 px-1">
                                                                <button type="button" onClick={() => {
                                                                    const newProfiles = [...formData.profiles];
                                                                    newProfiles.splice(index + 1, 0, { id: Date.now().toString(), name: prof.name, pin: prof.pin });
                                                                    setFormData({...formData, profiles: newProfiles});
                                                                }} title="تكرار الملف" className="w-6 h-6 flex items-center justify-center rounded-lg text-[var(--text-muted)] hover:text-white hover:bg-[var(--warning)] transition-colors"><i className="fas fa-copy text-xs"></i></button>
                                                                <button type="button" onClick={() => {
                                                                    const newProfiles = formData.profiles.filter((_, i) => i !== index);
                                                                    setFormData({...formData, profiles: newProfiles});
                                                                }} title="حذف الملف" className="w-6 h-6 flex items-center justify-center rounded-lg text-[var(--text-muted)] hover:text-white hover:bg-[var(--error)] transition-colors"><i className="fas fa-trash-alt text-xs"></i></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </>
                                        )}

                                        <div className="col-span-1 md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-5 mt-1">
                                            <div className="col-span-1">
                                                <label className="block text-sm font-bold text-[var(--text-main)] mb-2">البدء</label>
                                                <div className="h-[46px]">
                                                    <CustomDatePicker value={formData.startDate || ''} onChange={(val) => setFormData({...formData, startDate: val})} />
                                                </div>
                                            </div>

                                            <div className="col-span-1">
                                                <label className="block text-sm font-bold text-[var(--text-main)] mb-2">الانتهاء</label>
                                                <div className="h-[46px]">
                                                    <CustomDatePicker disabled={activeTab !== 'accounts'} value={formData.endDate || ''} onChange={(val) => {if(activeTab === 'accounts') setFormData({...formData, endDate: val})}} />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="col-span-1 md:col-span-2 mt-1">
                                            <label className="block text-sm font-bold text-[var(--text-main)] mb-2">ملاحظات</label>
                                            <textarea 
                                                value={formData.notes || ''} 
                                                onChange={(e) => setFormData({...formData, notes: e.target.value})} 
                                                className="w-full bg-[var(--input-bg)] border border-[var(--glass-border)] text-[var(--text-main)] rounded-xl p-4 focus:border-[var(--primary)] focus:shadow-[0_0_10px_rgba(56,189,248,0.2)] outline-none transition-all min-h-[100px] text-sm" 
                                            />
                                        </div>

                                        <div className="col-span-1 md:col-span-2 mt-4 flex justify-end gap-3 pt-5 border-t border-[var(--glass-border)]">
                                            <button type="button" onClick={() => setIsModalOpen(false)} className="px-6 py-3 rounded-xl text-[var(--text-main)] bg-[var(--input-bg)] hover:bg-[var(--hover-bg)] border border-[var(--glass-border)] transition-all font-bold text-sm"><i className="fas fa-times text-sm"></i></button>
                                            <button type="submit" className="px-6 py-3 rounded-xl text-white bg-gradient-to-l from-[var(--primary)] to-[var(--primary-hover)] hover:-translate-y-0.5 shadow-md transition-all font-bold flex items-center gap-2 text-sm">
                                                <i className="fas fa-save text-sm"></i>
                                            </button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}
                    
                    {noteDialog.isOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[110] p-4 animate-fadeIn">
                            <div className="admin-panel rounded-3xl w-full max-w-[420px] flex flex-col shadow-2xl p-6 border border-[var(--glass-border)] relative">
                                <button onClick={() => setNoteDialog({ isOpen: false, text: '' })} className="absolute top-4 left-4 w-8 h-8 rounded-full bg-[var(--input-bg)] flex items-center justify-center text-[var(--text-muted)] hover:text-[var(--error)] hover:bg-[rgba(239,68,68,0.1)] transition-all">
                                    <i className="fas fa-times text-sm"></i>
                                </button>
                                <div className="text-[var(--text-main)] whitespace-pre-wrap text-sm leading-relaxed max-h-[300px] overflow-y-auto mt-8 pr-2">
                                    {noteDialog.text}
                                </div>
                            </div>
                        </div>
                    )}

                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[110] p-4 animate-fadeIn">
                            <div className="admin-panel rounded-3xl w-full max-w-[420px] flex flex-col shadow-2xl p-7 border border-[var(--glass-border)]">
                                <div className="text-center mb-8 mt-2 flex flex-col items-center">
                                    <div className="w-16 h-16 bg-[rgba(239,68,68,0.1)] border border-[rgba(239,68,68,0.3)] rounded-full flex items-center justify-center mb-4 shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                                        <i className="fas fa-exclamation-triangle text-3xl text-[var(--error)]"></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-[var(--text-main)] mb-2">{confirmDialog.message}</h3>
                                </div>
                                <div className="flex justify-center gap-3 mt-2">
                                    <button onClick={() => setConfirmDialog({ isOpen: false, message: '', onConfirm: null })} className="px-6 py-3 flex-1 rounded-xl text-[var(--text-main)] bg-[var(--input-bg)] hover:bg-[var(--hover-bg)] border border-[var(--glass-border)] transition-all font-bold text-sm"><i className="fas fa-times text-sm"></i></button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog({ isOpen: false, message: '', onConfirm: null }); }} className="px-6 py-3 flex-1 rounded-xl text-white bg-[rgba(239,68,68,0.8)] hover:bg-[var(--error)] border border-[var(--error)] transition-all font-bold text-sm hover:shadow-[0_0_15px_rgba(239,68,68,0.5)]"><i className="fas fa-check text-sm"></i></button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [user, setUser] = React.useState(null);
            const [isAuthLoading, setIsAuthLoading] = React.useState(true);

            React.useEffect(() => {
                const unsubscribe = firebase.auth().onAuthStateChanged((u) => {
                    setUser(u);
                    setIsAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (isAuthLoading) {
                return (
                    <div className="flex items-center justify-center h-screen w-full relative z-10">
                        <i className="fas fa-circle-notch fa-spin text-5xl text-[var(--primary)]"></i>
                    </div>
                );
            }

            if (!user) {
                return <LoginScreen auth={firebase.auth()} />;
            }

            return <MainApp user={user} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
