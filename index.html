<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المتجر</title>
    
    <script type="text/javascript">
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) { history.replaceState(null, null, redirect); }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/react-router-dom@5.3.4/umd/react-router-dom.min.js"></script>

    <style>
        :root { color-scheme: dark; --bg-main: #0f172a; --primary: #38bdf8; --primary-hover: #0ea5e9; --success: #10b981; --error: #ef4444; --warning: #f59e0b; --text-main: #f8fafc; --text-muted: #cbd5e1; --glass-bg: rgba(15, 23, 42, 0.45); --glass-border: rgba(255, 255, 255, 0.1); --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); --glass-blur: blur(12px); --inner-bg: rgba(0, 0, 0, 0.2); --input-bg: rgba(255, 255, 255, 0.05); --hover-bg: rgba(255, 255, 255, 0.08); --blob-1: #38bdf8; --blob-2: #818cf8; --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body, input, textarea, select, button, div, span, p, h1, h2, h3, h4, h5, h6, th, td { font-family: 'Tajawal', sans-serif !important; }
        body { background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; position: relative; }
        .background-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: float 12s infinite alternate ease-in-out; }
        .blob-1 { width: 40vw; height: 40vw; background: var(--blob-1); top: -10%; right: -10%; }
        .blob-2 { width: 35vw; height: 35vw; background: var(--blob-2); bottom: -10%; left: -5%; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30px, 30px) scale(1.1); } }
        .admin-panel { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(120,120,120,0.5); }
        input[type=number] { -moz-appearance: textfield; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input:focus, select:focus, textarea:focus, button:focus { outline: none; border-color: var(--primary); }
        .gradient-text { background: linear-gradient(to left, var(--primary), var(--blob-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
    </style>
</head>
<body>
    <div class="background-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    
    <div id="root">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; gap: 1rem;">
            <i class="fas fa-circle-notch fa-spin text-5xl" style="color: var(--primary);"></i>
            <p style="color: var(--text-main); font-weight: bold;">جاري تحميل النظام...</p>
        </div>
    </div>

    <script>
        // هذا الكود يجلب الملفات المقسمة بالترتيب ويشغلها
        async function loadReactFiles() {
            const files = [
                'components/login.jsx',
                'components/emails.jsx',
                'components/accounts.jsx',
                'components/requests.jsx',
                'components/settings.jsx',
                'components/app.jsx'
            ];

            try {
                for (let file of files) {
                    const response = await fetch(file);
                    if (!response.ok) throw new Error(`لم يتم العثور على ملف: ${file}`);
                    const jsxCode = await response.text();
                    const transpiledCode = Babel.transform(jsxCode, { presets: ['react', 'env'] }).code;
                    const script = document.createElement('script');
                    script.innerHTML = transpiledCode;
                    document.body.appendChild(script);
                }
            } catch (error) {
                console.error("خطأ في التحميل:", error);
                document.getElementById('root').innerHTML = `<div style="text-align:center; padding: 50px; color: red;">حدث خطأ أثناء تحميل الملفات: ${error.message}</div>`;
            }
        }
        window.addEventListener('DOMContentLoaded', loadReactFiles);
    </script>
</body>
</html>
